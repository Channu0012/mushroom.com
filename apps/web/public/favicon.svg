<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0a1a0f"/>
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.25"/>
  <!-- Mushroom cap - bold dome shape -->
  <ellipse cx="256" cy="220" rx="150" ry="110" fill="url(#cap)" filter="url(#glow)"/>
  <!-- Cap highlight -->
  <ellipse cx="230" cy="180" rx="80" ry="40" fill="#86efac" opacity="0.3"/>
  <!-- Cap top shine -->
  <ellipse cx="240" cy="160" rx="40" ry="15" fill="white" opacity="0.2"/>
  <!-- Stem -->
  <rect x="210" y="280" width="92" height="120" rx="20" fill="url(#stem)"/>
  <!-- Stem highlight -->
  <rect x="225" y="285" width="25" height="100" rx="12" fill="white" opacity="0.12"/>
  <!-- Cap underside detail -->
  <path d="M 140 240 Q 256 280 372 240" fill="none" stroke="#15803d" stroke-width="6" opacity="0.5"/>
</svg>
